services:
  app:
    build: ./app
    container_name: ${APP_CONTAINER_NAME}
    working_dir: /usr/src/app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./app:/usr/src/app
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT}"
          memory: ${APP_MEM_LIMIT}
    networks:
      - backend
  sonarqube:
    build:
      context: ./sonarqube
      dockerfile: Dockerfile
    container_name: sonarqube
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SONARQUBE_PORT}:${SONARQUBE_PORT}"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    networks:
      - jenkins-network
  jenkins:

      build:
        context: ./jenkins
        dockerfile: Dockerfile
      image: ${JENKINS_IMAGE}
      container_name: jenkins
      restart: unless-stopped
      env_file:
        - .env

      environment:
        GIT_REPOSITORY: ${GIT_REPOSITORY}
        GIT_BRANCH: ${GIT_BRANCH}
        DEPLOY_HOST: ${SSH_HOST}
        DEPLOY_USER: ${APP_USER}
        DEPLOY_PATH: ${APP_DEPLOY_PATH}
        APP_PORT: ${APP_PORT}
        APP_HEALTH_PATH: ${APP_HEALTH_PATH}
        SSH_CREDENTIAL_ID: ${SSH_CREDENTIAL_ID}
        PM2_APP_NAME: ${PM2_APP_NAME}

      ports:
        - "${JENKINS_HTTP_PORT}:8080"
        - "${JENKINS_AGENT_PORT}:50000"

      volumes:
        - jenkins_home:${JENKINS_HOME}

      networks:
        - jenkins-network

      depends_on:
        - app


  db:
    image: postgres:15-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    ports:
     - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT}"
          memory: ${DB_MEM_LIMIT}
    networks:
      - backend

volumes:
  db_data:
  jenkins_home:
  app_data:
  sonarqube_data:


networks:
  backend:
    driver: bridge
  jenkins-network:
    driver: bridge

# ==========================================================
# NETWORK
# ==========================================================
